cve-checks:
  stage: cve-check
  needs: []
  image: registry.gitlab.com/cip-project/cip-core/debian-cve-checker:build-latest
  tags:
    - large
  script:
    - scripts/run-cve-checks.sh
  when: manual
  allow_failure: true
  artifacts:
    expire_in: 1 day
    paths:
      - cve-reports

