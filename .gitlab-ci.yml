variables:
  GIT_STRATEGY: clone
  release: trixie
  extension: none
  use_rt: enable
  encrypt: disable
  dtb: none
  deploy: disable
  build_updates: disable
  swupdate_version: default
  test_function: swupdate
  separate_home_partition: disable
  factory_reset: disable
  no_kernel: disable

stages:
  - build
  - test
  - cve-check

default:
  image: ghcr.io/siemens/kas/kas-isar:5.5
  before_script:
    - export http_proxy=$HTTP_PROXY
    - export https_proxy=$HTTPS_PROXY
    - export ftp_proxy=$FTP_PROXY
    - export no_proxy=$NO_PROXY
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export DISTRO_APT_PREMIRRORS=$DISTRO_APT_PREMIRRORS

.build_base:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH != "master"
  tags:
    - large-rootless
  variables:
    base_yaml: "kas-cip.yml:kas/board/${target}.yml"
  script:
    - if [ "${use_rt}" = "enable" ]; then base_yaml="${base_yaml}:kas/opt/rt.yml"; fi
    - if [ "${extension}" != "none" ]; then base_yaml="${base_yaml}:kas/opt/${extension}.yml"; fi
    - if [ "${separate_home_partition}" = "enable" ]; then base_yaml="${base_yaml}:kas/opt/separate-home-partition.yml"; fi
    - if [ "${release}" = "buster" ]; then base_yaml="${base_yaml}:kas/opt/buster.yml"; fi
    - if [ "${release}" = "bullseye" ]; then base_yaml="${base_yaml}:kas/opt/bullseye.yml"; fi
    - if [ "${release}" = "bookworm" ]; then base_yaml="${base_yaml}:kas/opt/bookworm.yml"; fi
    - if [ "${release}" = "trixie" ]; then base_yaml="${base_yaml}:kas/opt/trixie.yml"; fi
    - if [ "${release}" = "forky" ]; then base_yaml="${base_yaml}:kas/opt/forky.yml"; fi
    - if [ "${release}" = "sid" ]; then base_yaml="${base_yaml}:kas/opt/sid.yml"; fi
    - if [ "${encrypt}" = "enable" ]; then base_yaml="${base_yaml}:kas/opt/encrypt-data.yml"; fi
    - if [ "${factory_reset}" = "enable" ]; then base_yaml="${base_yaml}:kas/opt/factory-reset.yml"; fi
    - if [ "${watchdog}" = "disable" ]; then base_yaml="${base_yaml}:kas/opt/disable-watchdog.yml"; fi
    - if [ "${security_test}" = "enable" ]; then base_yaml="${base_yaml}:kas/opt/security_test.yml"; fi
    - if [ "${swupdate_version}" = "2022.12" ]; then base_yaml="${base_yaml}:kas/opt/swupdate-2022.12.yaml"; fi
    - if [ "${no_kernel}" = "enable" ]; then base_yaml="${base_yaml}:kas/opt/no_kernel.yml:kas/opt/targz.yml"; fi
    - echo "Building ${base_yaml}"
    - kas build ${base_yaml}
    - if [ "${deploy}" = "enable" ]; then scripts/deploy-cip-core.sh ${release} ${target} ${extension} ${no_kernel} ${dtb} ${CI_PIPELINE_ID} wic; fi
    - if [ "${build_updates}" = "enable" ]; then
          mkdir build/previous-image;
          if [ "${extension}" = "security" ] || [ "${extension}" = "ebg-secure-boot-snakeoil" ]; then
              cp build/tmp/deploy/images/${target}/*.verity build/previous-image;
          else
              cp build/tmp/deploy/images/${target}/*.squashfs build/previous-image;
          fi;
          cp build/tmp/deploy/images/${target}/linux.efi build/previous-image;
          echo "PV = \"2.0\"" >> recipes-core/images/cip-core-image.inc;
          kas build ${base_yaml}:kas/opt/delta-update.yml:kas/opt/kernel-panic.yml;
          for swu in build/tmp/deploy/images/${target}/*.swu; do
              mv "$swu" build/previous-image/$(basename "${swu%.swu}-broken.swu");
          done;
          echo "PV = \"2.1\"" >> recipes-core/images/cip-core-image.inc;
          kas build ${base_yaml}:kas/opt/delta-update.yml;
          for swu in build/previous-image/*-broken.swu; do
              mv "$swu" build/tmp/deploy/images/${target};
          done;
          scripts/deploy-cip-core.sh ${release} ${target} ${extension} ${no_kernel} ${dtb} ${CI_PIPELINE_ID} swus;
      fi

# base image
build:x86-uefi-base:
  extends:
    - .build_base
  variables:
    target: x86-uefi

build:qemu-amd64-base:
  extends:
    - .build_base
  variables:
    target: qemu-amd64
    extension: security
    security_test: enable
    use_rt: disable
    build_updates: enable
    separate_home_partition: enable
    deploy: enable

build:qemu-arm64-base:
  extends:
    - .build_base
  variables:
    target: qemu-arm64
    extension: security
    security_test: enable
    use_rt: disable
    build_updates: enable
    separate_home_partition: enable
    deploy: enable

build:qemu-arm-base:
  extends:
    - .build_base
  variables:
    target: qemu-arm
    extension: security
    security_test: enable
    use_rt: disable
    build_updates: enable
    separate_home_partition: enable
    deploy: enable

# test images
build:x86-uefi-test:
  extends:
    - .build_base
  variables:
    target: x86-uefi
    extension: test

.test-cip-core:
  stage: test
  image: $CI_REGISTRY_IMAGE/lavacli
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH != "master"
  tags:
    - small
  script:
    - scripts/submit_lava.sh ${test_function} ${target} ${CI_COMMIT_SHORT_SHA} ${release} ${CI_PIPELINE_ID} ${iec_test_timeout}
  artifacts:
    name: "$CI_JOB_NAME"
    when: always
    expire_in: 1 day
    paths:
      - results
    reports:
      junit: results/results*.xml

test:qemu-amd64-IEC:
  extends:
   - .test-cip-core
  needs: ["build:qemu-amd64-base"]
  variables:
    target: qemu-amd64
    test_function: IEC
    iec_test_timeout: 40

test:qemu-arm64-IEC:
  extends:
   - .test-cip-core
  needs: ["build:qemu-arm64-base"]
  variables:
    target: qemu-arm64
    test_function: IEC
    iec_test_timeout: 40

test:qemu-arm-IEC:
  extends:
   - .test-cip-core
  needs: ["build:qemu-arm-base"]
  variables:
    target: qemu-arm
    test_function: IEC
    iec_test_timeout: 40

cve-checks:
  stage: cve-check
  needs: []
  image: registry.gitlab.com/cip-project/cip-core/debian-cve-checker:build-latest
  tags:
    - large-rootless
  script:
    - scripts/run-cve-checks.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  allow_failure: true
  artifacts:
    expire_in: 1 day
    paths:
      - cve-reports

include: '.reproducible-check-ci.yml'

lavacli-container:
  stage: build
  image: quay.io/buildah/stable:v1.43.2
  variables:
    STORAGE_DRIVER: vfs
  tags:
    - small
  before_script:
    - echo $CI_REGISTRY_PASSWORD | buildah login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - buildah build -f scripts/Dockerfile.lavacli -t $CI_REGISTRY_IMAGE/lavacli .
    - buildah push $CI_REGISTRY_IMAGE/lavacli
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LAVACLI_CONTAINER'
