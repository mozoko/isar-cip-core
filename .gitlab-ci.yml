.test-cip-core:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH != "master"
  tags:
    - small
  script:
    - scripts/submit_lava.sh ${test_function} ${target} ${CI_COMMIT_SHORT_SHA} ${release} ${CI_COMMIT_REF_SLUG} ${iec_test_timeout}
  artifacts:
    name: "$CI_JOB_NAME"
    when: always
    expire_in: 1 day
    paths:
      - results
    reports:
      junit: results/results*.xml

test:qemu-amd64-secure-boot:
  extends:
    - .test-cip-core
  needs: ["build:qemu-amd64-base"]
  variables:
    target: qemu-amd64
    test_function: secure-boot

