DISTRO_ARCH = "arm64"

IMAGE_FSTYPES ?= "ext4"
IMAGE_FSTYPES:append:ftpm-stmm = " qemu-emmc"

USE_CIP_KERNEL_CONFIG = "1"

# watchdog is not yet supported in our QEMU executor for this platform, disable it
WDOG_TIMEOUT = "0"
