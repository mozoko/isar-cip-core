header:
  version: 14

distro: cip-core-trixie
target: cip-core-image

build_system: isar-rootless

repos:
  cip-core:

  isar:
    url: https://github.com/ilbers/isar.git
    commit: 1d8791f5ea178bc31ba2ff3c211ef5030f542c13
    layers:
      meta:
    patches:
      p1:
        repo: cip-core
        path: isar-patches/0001-isar-mounts-mount-run-as-tmpfs-for-systemd-execution.patch
      p2:
        repo: cip-core
        path: isar-patches/0002-image-postproc-extension-fix-machine-id-file-being-w.patch

bblayers_conf_header:
  standard: |
    LCONF_VERSION = "6"

local_conf_header:
  standard: |
    CONF_VERSION = "1"
  cross: |
    ISAR_CROSS_COMPILE = "1"
  ccache: |
    USE_CCACHE = "1"
  root_password: |
    USERS += "root"
    USER_root[password] = "root"
    USER_root[flags] = "clear-text-password"
  source_epoch: |
    SOURCE_DATE_EPOCH_FALLBACK := "${@bb.process.run("git -C ${LAYERDIR_cip-core} log -1 --pretty=%ct | tr -d '\n'")[0]}"

env:
  DISTRO_APT_PREMIRRORS: ""
